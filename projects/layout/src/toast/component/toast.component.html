@let toast = this.toast();
<div class="header">
    <span class="icon-container" [class.timed]="!!duration()" [style.animation-duration.ms]="duration()">
        <mat-icon>{{ icon() }}</mat-icon>
    </span>
    <h1>{{ toast.title }}</h1>
    <button matIconButton (click)="expire()">
        <mat-icon>close</mat-icon>
    </button>
</div>
<div class="content">
    @if (toast.body) {
        <p>{{ toast.body }}</p>
    }
    @if (toast.action) {
        <button (click)="toast.action()">action</button>
    }
</div>
