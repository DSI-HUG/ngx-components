@let toast = this.toast();
<div class="content">
    <div class="icon-container">
        <mat-icon>{{ icon() }}</mat-icon>
    </div>
    <h1>{{ toast.title }} {{ toast.body }}</h1>
    @if (toast.action; as action) {
        <button matButton (click)="action.execute()">{{ action.name }}</button>
    }
    <button aria-label="close" matIconButton (click)="expire()">
        <mat-icon>close</mat-icon>
    </button>
</div>
